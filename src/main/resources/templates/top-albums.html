<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Top Albums</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div style="
        text-align:center;
        margin-top:20px;
        margin-bottom:50px;
    ">

    <h1 style="
            font-size:56px;
            margin-bottom:10px;
        ">
      Top Albums
    </h1>

    <p style="
            color:#b3b3b3;
            font-size:18px;
        ">
      Highest rated albums by the community
    </p>

  </div>

  <div th:if="${#lists.isEmpty(topAlbums)}">

    <div class="card" style="
            text-align:center;
            padding:60px;
        ">

      <h2>No top albums yet</h2>

      <p style="color:#b3b3b3;">
        Albums will appear here after reviews are created.
      </p>

    </div>

  </div>

  <div class="album-grid">

    <div class="album-card"
         th:each="album : ${topAlbums}">

      <img th:src="${album.coverUrl}"
           alt="Album cover"
           class="album-cover">

      <h3 th:text="${album.title}"></h3>

      <br>

      <p>
        ⭐ Rating:
        <span th:text="${#numbers.formatDecimal(album.averageRating, 1, 1)}"></span>
      </p>

      <p>
        📝 Reviews:
        <span th:text="${album.reviewsCount}"></span>
      </p>

      <br>

      <a th:href="@{/albums/{id}(id=${album.albumId})}">
        Open album →
      </a>

    </div>

  </div>

  <br><br>

  <div style="text-align:center;">

    <a th:href="@{/albums}">
      Back to albums
    </a>

  </div>

</div>

</body>
</html>
