<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div style="
            text-align:center;
            margin-top:40px;
            margin-bottom:40px;
    ">

    <h1 style="
                font-size:56px;
                margin-bottom:10px;
        ">
      Join PeachHub
    </h1>

    <p style="
                color:#b3b3b3;
                font-size:18px;
        ">
      Create an account and start sharing your favorite albums
    </p>

  </div>

  <div class="card" style="
            max-width:550px;
            margin:0 auto;
            padding:40px;
    ">

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

      <div style="margin-bottom:20px;">

        <label style="
                        display:block;
                        margin-bottom:10px;
                        font-weight:bold;
                ">
          Username
        </label>

        <input type="text"
               th:field="*{username}"
               placeholder="Choose username"
               required
               style="
                            width:100%;
                            padding:15px;
                            border:none;
                            border-radius:14px;
                            background:#1e1e1e;
                            color:white;
                            font-size:16px;
                       ">

      </div>

      <div style="margin-bottom:20px;">

        <label style="
                        display:block;
                        margin-bottom:10px;
                        font-weight:bold;
                ">
          Email
        </label>

        <input type="email"
               th:field="*{email}"
               placeholder="Enter email"
               required
               style="
                            width:100%;
                            padding:15px;
                            border:none;
                            border-radius:14px;
                            background:#1e1e1e;
                            color:white;
                            font-size:16px;
                       ">

      </div>

      <div style="margin-bottom:30px;">

        <label style="
                        display:block;
                        margin-bottom:10px;
                        font-weight:bold;
                ">
          Password
        </label>

        <input type="password"
               th:field="*{password}"
               placeholder="Create password"
               required
               style="
                            width:100%;
                            padding:15px;
                            border:none;
                            border-radius:14px;
                            background:#1e1e1e;
                            color:white;
                            font-size:16px;
                       ">

      </div>

      <button type="submit"
              style="
                        width:100%;
                        padding:16px;
                        border:none;
                        border-radius:14px;
                        font-size:16px;
                        font-weight:bold;
                        cursor:pointer;
                    ">
        Create Account
      </button>

    </form>

    <div style="
                text-align:center;
                margin-top:25px;
                color:#b3b3b3;
        ">

      Already have an account?

      <a th:href="@{/login}">
        Login
      </a>

    </div>

  </div>

</div>

</body>
</html>
