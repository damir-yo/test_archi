<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>PeacHub</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div style="
        padding: 120px 40px;
        border-radius: 24px;
        background: linear-gradient(135deg, #1a1a1a, #111111);
        margin-top: 30px;
        margin-bottom: 50px;
        text-align: center;
        border: 1px solid #2a2a2a;
    ">

    <p style="
            color:#ff9f6b;
            letter-spacing:4px;
            margin-bottom:20px;
            font-weight:bold;
        ">
      MUSIC COMMUNITY PLATFORM
    </p>

    <h1 style="
            font-size:72px;
            margin-bottom:20px;
            line-height:1;
        ">
      PeacHub
    </h1>

    <p style="
            max-width:700px;
            margin:auto;
            color:#b3b3b3;
            font-size:20px;
        ">
      Discover albums, write reviews,
      rate music and build your taste.
    </p>

    <br><br>

    <form th:action="@{/albums/search}"
          method="get"
          class="search-bar"
          style="
                max-width:700px;
                margin:auto;
              ">

      <input type="text"
             name="query"
             placeholder="Search albums, artists or genres...">

      <button type="submit">
        Search
      </button>

    </form>

  </div>

  <div class="album-grid">

    <div class="album-card">

      <h2>
        Albums
      </h2>

      <p>
        Explore music catalog
      </p>

      <br>

      <a th:href="@{/albums}">
        Open →
      </a>

    </div>

    <div class="album-card">

      <h2>
        Top Rated
      </h2>

      <p>
        Best community rated albums
      </p>

      <br>

      <a th:href="@{/albums/top}">
        Open →
      </a>

    </div>

    <div class="album-card">

      <h2>
        Favorites
      </h2>

      <p>
        Your personal collection
      </p>

      <br>

      <a th:href="@{/favorites}">
        Open →
      </a>

    </div>

  </div>

</div>

</body>
</html>
