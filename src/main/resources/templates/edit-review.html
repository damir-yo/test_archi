<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Edit Review</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div style="
            text-align:center;
            margin-top:20px;
            margin-bottom:40px;
    ">

    <h1 style="
                font-size:48px;
                margin-bottom:10px;
        ">
      Edit Review
    </h1>

    <p style="
                color:#b3b3b3;
                font-size:18px;
        ">
      Update your thoughts and rating
    </p>

  </div>

  <div class="card" style="
            max-width:700px;
            margin:0 auto;
    ">

    <div style="
                display:flex;
                gap:20px;
                align-items:center;
                margin-bottom:30px;
        ">

      <img th:src="${review.album.coverUrl}"
           alt="Album cover"
           style="
                        width:140px;
                        height:140px;
                        object-fit:cover;
                        border-radius:16px;
                 ">

      <div>

        <h2 th:text="${review.album.title}"
            style="margin-bottom:10px;">
        </h2>

        <p style="
                        color:#b3b3b3;
                        font-size:15px;
                ">
          Change your review anytime
        </p>

      </div>

    </div>

    <form th:action="@{/albums/{albumId}/reviews/{reviewId}/edit(
                albumId=${review.album.id},
                reviewId=${review.id}
        )}"
          method="post"
          th:object="${review}">

      <div style="margin-bottom:25px;">
        <div style="margin-bottom:25px;">

          <label style="
            display:block;
            margin-bottom:10px;
            font-weight:bold;
    ">
            Review title
          </label>

          <input type="text"
                 th:field="*{title}"
                 placeholder="Enter review title..."
                 style="
                width:100%;
                padding:16px;
                border-radius:14px;
                border:none;
                font-size:16px;
                background:#1e1e1e;
                color:white;
                box-sizing:border-box;
           ">

        </div>
        <label style="
                        display:block;
                        margin-bottom:10px;
                        font-weight:bold;
                ">
          Your review
        </label>

        <textarea th:field="*{content}"
                  placeholder="Update your review..."
                  style="
                                width:100%;
                                min-height:180px;
                                padding:16px;
                                border-radius:14px;
                                border:none;
                                resize:vertical;
                                font-size:16px;
                                background:#1e1e1e;
                                color:white;
                          ">
                </textarea>

      </div>

      <div style="margin-bottom:30px;">

        <label style="
                        display:block;
                        margin-bottom:12px;
                        font-weight:bold;
                ">
          Rating
        </label>

        <select th:field="*{rating}"
                style="
                                width:100%;
                                padding:16px;
                                border:none;
                                border-radius:14px;
                                background:#1e1e1e;
                                color:white;
                                font-size:16px;
                                cursor:pointer;
                                outline:none;
                        ">

          <option value="1">1 ⭐</option>
          <option value="2">2 ⭐</option>
          <option value="3">3 ⭐</option>
          <option value="4">4 ⭐</option>
          <option value="5">5 ⭐</option>
          <option value="6">6 ⭐</option>
          <option value="7">7 ⭐</option>
          <option value="8">8 ⭐</option>
          <option value="9">9 ⭐</option>
          <option value="10">10 ⭐</option>

        </select>

      </div>

      <button type="submit"
              style="
                        width:100%;
                        padding:16px;
                        font-size:16px;
                        font-weight:bold;
                        border:none;
                        border-radius:14px;
                        cursor:pointer;
                    ">

        Save Changes

      </button>

    </form>

  </div>

</div>

</body>
</html>
