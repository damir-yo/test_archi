<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Album</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div class="card">

    <div class="album-header">

      <div class="album-cover-wrapper">

        <img th:if="${album.coverUrl != null}"
             th:src="${album.coverUrl}"
             alt="Album cover"
             class="album-cover-large">

        <div th:unless="${album.coverUrl != null}"
             class="album-cover-placeholder">
          No Cover
        </div>

      </div>

      <div class="album-info">

        <h1 class="album-title"
            th:text="${album.title}">
        </h1>

        <p class="album-meta">

          <span th:text="${album.artist}"></span>

          •

          <span th:text="${album.genre}"></span>

          •

          <span th:text="${album.releaseYear}"></span>

        </p>

        <div class="album-actions">

          <a th:href="@{/albums/{id}/reviews/new(id=${album.id})}">
            <button>
              Write review
            </button>
          </a>

          <div th:if="${!isFavorite}">

            <form th:action="@{/favorites/{albumId}(albumId=${album.id})}"
                  method="post">

              <button type="submit">
                Add to favorites
              </button>

            </form>

          </div>

          <div th:if="${isFavorite}">

            <form th:action="@{/favorites/{albumId}/delete(albumId=${album.id})}"
                  method="post">

              <input type="hidden"
                     name="source"
                     value="album">

              <button type="submit">
                Remove from favorites
              </button>

            </form>

          </div>

        </div>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
             style="margin-top:30px;">

          <a th:href="@{/albums/{id}/edit(id=${album.id})}">
            Edit album
          </a>

          <br><br>

          <form th:action="@{/albums/{id}/delete(id=${album.id})}"
                method="post">

            <button type="submit"
                    class="danger-button">

              Delete album

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <h2 style="margin-top:40px;">
    Reviews
  </h2>

  <div th:if="${#lists.isEmpty(reviews)}">

    <div class="card">

      <p>
        No reviews yet
      </p>

    </div>

  </div>

  <div th:each="review : ${reviews}">

    <div class="review-card">

      <h3>

        <a th:href="@{/albums/{albumId}/reviews/{reviewId}(
                    albumId=${album.id},
                    reviewId=${review.id}
                )}"
           th:text="${review.title != null and !#strings.isEmpty(review.title) ? review.title : 'Untitled Review'}">

          Review Title

        </a>

      </h3>

      <p th:text="${#strings.abbreviate(review.content, 250)}"></p>

      <small>

        <span th:text="${review.user.username}"></span>

        •

        <span th:text="${review.rating}"></span>/10

      </small>

      <br><br>

      <div th:if="${#authentication.name == review.user.username}">

        <a th:href="@{/albums/{albumId}/reviews/{reviewId}/edit(
                    albumId=${album.id},
                    reviewId=${review.id}
                )}">
          Edit
        </a>

        <br><br>

        <form th:action="@{/albums/{albumId}/reviews/{reviewId}/delete(
                    albumId=${album.id},
                    reviewId=${review.id}
                )}"
              method="post">

          <button type="submit"
                  class="danger-button">

            Delete

          </button>

        </form>

      </div>

    </div>

  </div>

</div>

</body>
</html>
