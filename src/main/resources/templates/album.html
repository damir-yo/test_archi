<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Album</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div class="card">

    <div style="display:flex; gap:40px; flex-wrap:wrap;">

      <div>

        <img th:src="${album.coverUrl}"
             alt="Album cover"
             width="320">

      </div>

      <div style="flex:1; min-width:280px;">

        <h1 th:text="${album.title}"></h1>

        <p class="album-meta">

          <span th:text="${album.artist}"></span>

          <span>•</span>

          <span th:text="${album.genre}"></span>

          <span>•</span>

          <span th:text="${album.releaseYear}"></span>

        </p>

        <br>

        <a th:href="@{/albums/{id}/reviews/new(id=${album.id})}">
          <button>
            Write review
          </button>
        </a>

        <br><br>

        <div th:if="${!isFavorite}">

          <form th:action="@{/favorites/{albumId}(albumId=${album.id})}"
                method="post">

            <button type="submit">
              Add to favorites
            </button>

          </form>

        </div>

        <div th:if="${isFavorite}">

          <form th:action="@{/favorites/{albumId}/delete(albumId=${album.id})}"
                method="post">

            <input type="hidden"
                   name="source"
                   value="album">

            <button type="submit">
              Remove from favorites
            </button>

          </form>

        </div>

        <br>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

          <a th:href="@{/albums/{id}/edit(id=${album.id})}">
            Edit album
          </a>

          <br><br>

          <form th:action="@{/albums/{id}/delete(id=${album.id})}"
                method="post">

            <button type="submit"
                    class="danger-button">

              Delete album

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <h2>Reviews</h2>

  <div th:if="${#lists.isEmpty(reviews)}">

    <div class="card">

      <p>
        No reviews yet
      </p>

    </div>

  </div>

  <div th:each="review : ${reviews}">

    <div class="review-card">

      <h3>

        <a th:href="@{/albums/{albumId}/reviews/{reviewId}(
                albumId=${album.id},
                reviewId=${review.id}
            )}"
           th:text="${review.title != null and !#strings.isEmpty(review.title) ? review.title : 'Untitled Review'}">

          Review Title

        </a>

      </h3>

      <p th:text="${review.content}"></p>

      <small>

        <span th:text="${review.user.username}"></span>

        •

        <span th:text="${review.rating}"></span>/10

      </small>

      <br><br>

      <div th:if="${#authentication.name == review.user.username}">

        <a th:href="@{/albums/{albumId}/reviews/{reviewId}/edit(
                    albumId=${album.id},
                    reviewId=${review.id}
                )}">
          Edit
        </a>

        <br><br>

        <form th:action="@{/albums/{albumId}/reviews/{reviewId}/delete(
                    albumId=${album.id},
                    reviewId=${review.id}
                )}"
              method="post">

          <button type="submit"
                  class="danger-button">

            Delete

          </button>

        </form>

      </div>

    </div>

  </div>

</div>

</body>
</html>
