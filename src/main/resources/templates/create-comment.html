<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Create Comment</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div style="
        text-align:center;
        margin-top:20px;
        margin-bottom:50px;
    ">

    <h1 style="
            font-size:56px;
            margin-bottom:10px;
        ">
      Create Comment
    </h1>

    <p style="
            color:#b3b3b3;
            font-size:18px;
        ">
      Share your thoughts about this review
    </p>

  </div>

  <div class="card" style="
        max-width:700px;
        margin:0 auto;
        padding:40px;
    ">

    <form method="post"
          th:action="@{/albums/{albumId}/reviews/{reviewId}/comments(
                    albumId=${albumId},
                    reviewId=${reviewId}
              )}"
          th:object="${comment}">

      <label style="
                display:block;
                margin-bottom:12px;
                font-size:18px;
            ">
        Comment
      </label>

      <textarea th:field="*{content}"
                placeholder="Write your comment..."
                style="
                        width:100%;
                        min-height:180px;
                        padding:15px;
                        border-radius:12px;
                        border:none;
                        resize:vertical;
                        font-size:16px;
                        margin-bottom:25px;
                    "></textarea>

      <button type="submit"
              style="
                        width:100%;
                        padding:15px;
                        font-size:18px;
                    ">
        Create Comment
      </button>

    </form>

  </div>

</div>

</body>
</html>
