<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Favorites</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <div style="
        text-align:center;
        margin-bottom:50px;
        margin-top:20px;
    ">

        <h1 style="
            font-size:56px;
            margin-bottom:10px;
        ">
            Favorite Albums
        </h1>

        <p style="
            color:#b3b3b3;
            font-size:18px;
        ">
            Your saved music collection
        </p>

    </div>

    <div th:if="${#lists.isEmpty(favorites)}">

        <div class="card" style="
            text-align:center;
            padding:60px;
        ">

            <h2>No favorite albums yet</h2>

            <p style="color:#b3b3b3;">
                Start adding albums to build your collection.
            </p>

            <br>

            <a th:href="@{/albums}">
                Browse albums →
            </a>

        </div>

    </div>

    <div class="album-grid">

        <div class="album-card"
             th:each="favorite : ${favorites}">

            <img th:src="${favorite.album.coverUrl}"
                 alt="Album cover"
                 class="album-cover">

            <h3 th:text="${favorite.album.title}"></h3>

            <p>

                <span th:text="${favorite.album.artist}"></span>

                •

                <span th:text="${favorite.album.genre}"></span>

            </p>

            <br>

            <a th:href="@{/albums/{id}(id=${favorite.album.id})}">
                Open album
            </a>

            <br><br>

            <form th:action="@{/favorites/{albumId}/delete(albumId=${favorite.album.id})}"
                  method="post">

                <input type="hidden"
                       name="source"
                       value="favorites">

                <button type="submit">
                    Remove
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
