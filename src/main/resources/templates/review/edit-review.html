<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Редактирование отзыва</title>
    <link rel="icon" type="image/png" th:href="@{/images/peach.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
  <body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

      <div class="review-header">

        <h1 class="review-title">
          Редактирование отзыва
        </h1>

        <p class="review-subtitle">
          Обновите своё мнение и оценку
        </p>

      </div>

      <div class="card review-form-card">

        <div class="review-album-info">

          <img th:src="${review.album.coverUrl}"
               alt="Обложка альбома"
               class="review-album-cover">

          <div>

            <h2 th:text="${review.album.title}"
                class="review-album-title">
            </h2>

            <p class="review-album-description">
              Вы можете изменить свой отзыв в любое время
            </p>

          </div>

        </div>

        <form th:action="@{/albums/{albumId}/reviews/{reviewId}/edit(
                    albumId=${review.album.id},
                    reviewId=${review.id}
            )}"
              method="post"
              th:object="${review}">

          <div class="form-group">

            <label class="form-label">
              Заголовок отзыва
            </label>

            <input type="text"
                   th:field="*{title}"
                   placeholder="Введите заголовок отзыва..."
                   class="review-title-input">

          </div>

          <div class="form-group">

            <label class="form-label">
              Ваш отзыв
            </label>

            <textarea th:field="*{content}"
                      placeholder="Обновите свой отзыв..."
                      class="review-textarea">
                    </textarea>

          </div>

          <div class="form-group-password">

            <label class="rating-label">
              Оценка
            </label>

            <select th:field="*{rating}"
                    class="rating-select">

              <option value="1">1 ⭐</option>
              <option value="2">2 ⭐</option>
              <option value="3">3 ⭐</option>
              <option value="4">4 ⭐</option>
              <option value="5">5 ⭐</option>
              <option value="6">6 ⭐</option>
              <option value="7">7 ⭐</option>
              <option value="8">8 ⭐</option>
              <option value="9">9 ⭐</option>
              <option value="10">10 ⭐</option>

            </select>

          </div>

          <button type="submit"
                  class="auth-button">

            Сохранить изменения

          </button>

        </form>

      </div>

    </div>

  </body>
</html>
