<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/peach.png}">
    <title>Редактирование альбома</title>
    <meta charset="UTF-8">
  </head>
  <body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Редактирование альбома</h1>

    <form th:action="@{/albums/{id}/edit(id=${albumId})}"
          th:object="${albumForm}"
          method="post">

      <div>
        <label>Название</label>
        <input type="text" th:field="*{title}">

        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
        </p>
      </div>

      <div>
        <label>Исполнитель</label>
        <input type="text" th:field="*{artist}">

        <p th:if="${#fields.hasErrors('artist')}"
           th:errors="*{artist}">
        </p>
      </div>

      <div>
        <label>Жанр</label>
        <input type="text" th:field="*{genre}">

        <p th:if="${#fields.hasErrors('genre')}"
           th:errors="*{genre}">
        </p>
      </div>

      <div>
        <label>Год выпуска</label>
        <input type="number" th:field="*{releaseYear}">

        <p th:if="${#fields.hasErrors('releaseYear')}"
           th:errors="*{releaseYear}">
        </p>
      </div>

      <div>
        <label>URL обложки</label>
        <input type="text" th:field="*{coverUrl}">
      </div>

      <div>
        <label>Внешний ID</label>
        <input type="number" th:field="*{externalId}">
      </div>

      <button type="submit">
        Сохранить
      </button>

    </form>

  </body>
</html>
