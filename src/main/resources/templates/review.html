<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title th:text="${review.title}">Review</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

  <div class="card" style="padding:40px;">

    <div style="
            display:flex;
            gap:35px;
            align-items:flex-start;
            flex-wrap:wrap;
        ">

      <img th:src="${review.album.coverUrl}"
           alt="Album cover"
           style="
                    width:260px;
                    border-radius:20px;
                    box-shadow:0 8px 25px rgba(0,0,0,0.35);
                 ">

      <div style="flex:1;">

        <h1 th:text="${review.title}"
            style="
                        font-size:42px;
                        font-weight:700;
                        margin-bottom:12px;
                        line-height:1.2;
                ">
        </h1>

        <h2 th:text="${review.album.title}"
            style="
                        font-size:28px;
                        margin-bottom:8px;
                ">
        </h2>

        <p style="
                    color:#b3b3b3;
                    margin-bottom:25px;
                    font-size:16px;
                ">

          <span th:text="${review.album.artist}"></span>

          •

          <span th:text="${review.album.genre}"></span>

          •

          <span th:text="${review.album.releaseYear}"></span>

        </p>

        <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                    flex-wrap:wrap;
                    margin-bottom:30px;
                ">

                    <span style="
                        background:#202020;
                        border:1px solid #303030;
                        padding:10px 16px;
                        border-radius:12px;
                        font-weight:600;
                    ">
                        ⭐ <span th:text="${review.rating}"></span>/10
                    </span>

          <span style="color:#b3b3b3;">
                        by
                        <a th:href="@{/users/{id}(id=${review.user.id})}"
                           th:text="${review.user.username}">
                        </a>
                    </span>

        </div>

        <div style="
                    background:#181818;
                    border:1px solid #2a2a2a;
                    border-radius:18px;
                    padding:28px;
                ">

          <p th:text="${review.content}"
             style="
                            margin:0;
                            line-height:1.9;
                            font-size:18px;
                            white-space:pre-wrap;
                       ">
          </p>

        </div>

        <div style="
        display:flex;
        align-items:center;
        gap:12px;
        margin-top:25px;
">

          <div style="
            background:#202020;
            border:1px solid #303030;
            border-radius:12px;
            height:42px;
            padding:0 16px;
            display:flex;
            align-items:center;
            font-weight:600;
    ">
            ❤️ <span style="margin-left:6px;"
                     th:text="${review.likes.size()}"></span>
          </div>

          <div th:if="${!isLiked}">

            <form th:action="@{/albums/{albumId}/reviews/{reviewId}/likes(
                albumId=${review.album.id},
                reviewId=${review.id}
        )}"
                  method="post"
                  style="margin:0;">

              <button type="submit"
                      style="
                        height:42px;
                        background:#f59e0b;
                        color:white;
                        border:none;
                        border-radius:12px;
                        padding:0 18px;
                        cursor:pointer;
                        font-weight:600;
                    ">
                ❤️ Like
              </button>

            </form>

          </div>

          <div th:if="${isLiked}">

            <form th:action="@{/albums/{albumId}/reviews/{reviewId}/likes/delete(
                albumId=${review.album.id},
                reviewId=${review.id}
        )}"
                  method="post"
                  style="margin:0;">

              <button type="submit"
                      style="
                        height:42px;
                        background:#2c2c2c;
                        color:white;
                        border:1px solid #404040;
                        border-radius:12px;
                        padding:0 18px;
                        cursor:pointer;
                        font-weight:600;
                    ">
                ✓ Liked
              </button>

            </form>

          </div>

        </div>

        <div th:if="${isOwner}"
             style="
                        display:flex;
                        gap:10px;
                        margin-top:20px;
                        flex-wrap:wrap;
                ">

          <a th:href="@{/albums/{albumId}/reviews/{reviewId}/edit(
        albumId=${review.album.id},
        reviewId=${review.id}
)}"
             style="
        display:flex;
        align-items:center;
        justify-content:center;
        background:#2563eb;
        color:white;
        text-decoration:none;
        padding:10px 16px;
        border-radius:10px;

        height:42px;
        box-sizing:border-box;
   ">
            ✏️ Edit Review
          </a>
          <form th:action="@{/albums/{albumId}/reviews/{reviewId}/delete(
                            albumId=${review.album.id},
                            reviewId=${review.id}
                    )}"
                method="post">

            <button type="submit"
                    class="danger-button"
                    style="
                                    padding:10px 16px;
                                    border-radius:10px;
                                ">
              🗑 Delete Review
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <h2 style="
        margin-top:50px;
        margin-bottom:25px;
        font-size:30px;
    ">
    💬 Comments
  </h2>

  <div class="card" style="
        padding:30px;
        margin-bottom:40px;
    ">

    <form method="post"
          th:action="@{/albums/{albumId}/reviews/{reviewId}/comments(
                    albumId=${review.album.id},
                    reviewId=${review.id}
              )}"
          th:object="${comment}">

            <textarea th:field="*{content}"
                      placeholder="Write your comment..."
                      style="
                        width:100%;
                        min-height:140px;
                        padding:15px;
                        border:none;
                        border-radius:12px;
                        resize:vertical;
                        font-size:16px;
                        margin-bottom:20px;
                    ">
            </textarea>

      <button type="submit">
        Add Comment
      </button>

    </form>

  </div>

  <div th:if="${#lists.isEmpty(review.comments)}">

    <div class="card">

      <p>No comments yet</p>

    </div>

  </div>

  <div th:each="comment : ${review.comments}">

    <div class="card"
         style="
                padding:22px;
                margin-bottom:16px;
                border-radius:16px;
        ">

      <p th:text="${comment.content}"
         style="
                    line-height:1.8;
                    margin-bottom:12px;
               ">
      </p>

      <small style="color:#b3b3b3;">

        Author:

        <a th:href="@{/users/{id}(id=${comment.user.id})}"
           th:text="${comment.user.username}">
        </a>

      </small>

    </div>

  </div>

  <br><br>

  <div style="text-align:center;">

    <a th:href="@{/albums/{id}(id=${review.album.id})}">
      ← Back to album
    </a>

  </div>

</div>

</body>
</html>
